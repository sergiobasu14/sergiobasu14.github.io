<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Soluciones de IA aplicada, agentes, RAG y arquitectura de datos. Conoce la experiencia y los proyectos de Sergio Ballesteros."
    />
    <meta name="theme-color" content="#f5f3eb" />
    <meta name="author" content="Sergio Andrés Ballesteros Suárez" />
    <title>Sergio Ballesteros — IA aplicada y datos</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style/style.css" />
    <script src="js/content.js" defer></script>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-text="skip">Ir al contenido</a>
    <header class="site-header container">
      <a class="brand" href="#" aria-label="Sergio Ballesteros — Inicio"
        >Sergio Ballesteros<span class="brand-dot" aria-hidden="true"
          >.</span
        ></a
      >
      <div class="header-controls">
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="navigation"
        >
          <span></span><span></span
          ><span class="sr-only" data-text="menu">Abrir menú</span>
        </button>
        <nav id="navigation" aria-label="Principal"></nav>
        <div class="languages" role="group" aria-label="Language / Idioma">
          <button type="button" data-lang="es" aria-pressed="true">ES</button
          ><span aria-hidden="true">/</span
          ><button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>
    <main id="main">
      <section class="hero container" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title"></h1>
          <p class="hero-intro" data-text="intro"></p>
          <p class="hero-detail" data-text="heroDetail"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#contacto"
              ><span data-text="talk"></span
              ><span aria-hidden="true">↗</span></a
            ><a class="text-link" href="#proyectos"
              ><span data-text="explore"></span
              ><span aria-hidden="true">↓</span></a
            >
          </div>
        </div>
        <!-- Flujo abstracto vectorial: un recurso de marca, no un producto simulado. -->
        <div class="hero-art" aria-hidden="true">
          <svg id="flow-art" viewBox="0 0 620 440" fill="none">
            <g id="flow-lines"></g>
            <g class="flow-nodes">
              <circle cx="120" cy="202" r="5" />
              <circle cx="472" cy="106" r="8" />
              <circle cx="495" cy="316" r="5" />
              <circle cx="260" cy="293" r="4" />
            </g>
          </svg>
          <div class="flow-caption"></div>
        </div>
      </section>
      <div class="proof container">
        <div id="metrics" class="metrics"></div>
        <p class="metric-note" data-text="metricNote"></p>
      </div>
      <section
        id="servicios"
        class="section container services-section"
        aria-labelledby="services-title"
      >
        <div class="section-heading">
          <span class="section-label" data-nav="0"></span>
          <h2 id="services-title" data-text="servicesTitle"></h2>
          <p data-text="servicesIntro"></p>
        </div>
        <div id="service-list" class="service-list"></div>
      </section>
      <section
        id="proyectos"
        class="section portfolio-section"
        aria-labelledby="projects-title"
      >
        <div class="container">
          <div class="section-top">
            <div>
              <span class="section-label" data-nav="1"></span>
              <h2 id="projects-title" data-text="projectsTitle"></h2>
            </div>
            <p data-text="projectsIntro"></p>
          </div>
          <div id="project-list" class="project-grid"></div>
        </div>
      </section>
      <section
        id="trayectoria"
        class="section container experience-section"
        aria-labelledby="experience-title"
      >
        <div class="section-heading">
          <span class="section-label" data-nav="2"></span>
          <h2 id="experience-title" data-text="experienceTitle"></h2>
          <p data-text="experienceIntro"></p>
          <a
            class="text-link cv-link"
            href="Sergio%20Ballesteros%20-%20AI%20Engineer.pdf"
            download
            ><span data-text="cv"></span><span aria-hidden="true">↓</span></a
          >
        </div>
        <ol id="experience-list" class="timeline"></ol>
      </section>
      <section class="section about-section" aria-labelledby="about-title">
        <div class="container about-layout">
          <div class="portrait">
            <img
              src="images/profile.jpg"
              alt="Retrato de Sergio Ballesteros"
              width="800"
              height="800"
              loading="lazy"
            />
            <p>Sergio Andrés<br />Ballesteros Suárez</p>
          </div>
          <div class="about-content">
            <h2 id="about-title" data-text="aboutTitle"></h2>
            <p class="about-description" data-text="about"></p>
            <h3 data-text="skillsTitle"></h3>
            <div id="skills" class="skills"></div>
            <h3 data-text="educationTitle"></h3>
            <div id="education" class="education"></div>
          </div>
        </div>
      </section>
      <section
        id="contacto"
        class="contact-section"
        aria-labelledby="contact-title"
      >
        <div class="container contact-layout">
          <div>
            <span class="section-label" data-nav="3"></span>
            <h2 id="contact-title" data-text="contactTitle"></h2>
            <p data-text="contactText"></p>
          </div>
          <div class="contact-links">
            <span class="contact-label" data-text="emailLabel"></span
            ><a class="email-link" href="mailto:sergio.ballesteros@pm.me"
              >sergio.ballesteros@pm.me<span aria-hidden="true">↗</span></a
            >
            <div class="contact-actions">
              <button id="copy-email" type="button" data-text="copy"></button
              ><a
                href="https://www.linkedin.com/in/engineersergio/"
                target="_blank"
                rel="noopener noreferrer"
                >LinkedIn <span aria-hidden="true">↗</span></a
              >
            </div>
            <p
              id="copy-status"
              class="copy-status"
              role="status"
              aria-live="polite"
            ></p>
          </div>
        </div>
      </section>
    </main>
    <footer class="container footer">
      <span>© <span id="year"></span> Sergio Ballesteros</span
      ><span data-text="footer"></span><a href="#" data-text="backTop"></a>
    </footer>
    <noscript
      ><div class="noscript">
        Sergio Ballesteros — Ingeniero de IA y datos / AI & data engineer.
        <a href="Sergio%20Ballesteros%20-%20AI%20Engineer.pdf"
          >Descarga el CV / Download the CV</a
        >.
        <a href="mailto:sergio.ballesteros@pm.me">sergio.ballesteros@pm.me</a>.
        Activa JavaScript para ver el sitio completo / Enable JavaScript to view
        the full website.
      </div></noscript
    >
  </body>
</html>
